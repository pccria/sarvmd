name: sarvmd_ui
description: "A flexible, high-precision music manuscript designer for composers, educators, and engravers to create custom printable staff notebooks and layout designs."
version: 0.13.0
homepage: https://github.com/pccria/sarvmd
repository: https://github.com/pccria/sarvmd
issue_tracker: https://github.com/pccria/sarvmd/issues
documentation: https://github.com/pccria/sarvmd#readme
publish_to: 'none'
resolution: workspace
environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  sarvmd_core:
    path: ../../packages/sarvmd_core
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_svg: ^2.0.10
  flutter_driver:
    sdk: flutter
  shared_preferences: ^2.5.5
  flutter_bloc: ^8.1.6
  logd: ^0.10.0
  file_picker: ^8.1.7

  path: any
  url_launcher: ^6.3.2
  desktop_drop: ^0.8.4
dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Bravura
      fonts:
        - asset: assets/fonts/Bravura.otf
    - family: IranNastaliq
      fonts:
        - asset: assets/fonts/IranNastaliq.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700

  assets:
    - assets/handwriting/
    - CHANGELOG.md
